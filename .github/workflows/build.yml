name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  build_and_test:
    name: Build, Test, and Pack
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Signing the provenance statement for the packages this job produces. Stated explicitly
      # because attestation needs more than the read-only default.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Install PipeWire runtime + dev headers + libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-0 \
            libpipewire-0.3-dev \
            libclang-dev \
            pkg-config

      - uses: actions/setup-dotnet@v5
        with:
          # net11.0 target requires the .NET 11 preview SDK alongside the .NET 10 SDK.
          # global.json (rollForward latestMajor, allowPrerelease) then selects the 11 SDK,
          # which builds both the net10.0 and net11.0 target frameworks.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore PipeWire.NET.slnx

      - name: Build
        run: dotnet build PipeWire.NET.slnx --no-restore -c Release

      - name: Test (non-integration on host runner)
        run: dotnet test PipeWire.NET.slnx --no-build -c Release --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
             --filter "TestCategory!=Integration"

      - name: Summarize coverage
        # Renders the cobertura totals into the run summary. Uploading the raw XML alone means nobody
        # ever looks at it; this puts the numbers on the run page itself.
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          files = sorted(glob.glob('**/coverage.cobertura.xml', recursive=True))
          if not files:
              print('### Coverage\n\nNo coverage report was produced.')
              raise SystemExit(0)

          # Multi-targeted runs emit one report per TFM; they cover the same code, so report the first
          # and note how many were produced rather than double-counting.
          root = ET.parse(files[0]).getroot()

          def pct(attr):
              return float(root.get(attr) or 0) * 100

          print('### Coverage\n')
          print('| Metric | Covered | Total | Rate |')
          print('| --- | ---: | ---: | ---: |')
          print(f"| Lines | {root.get('lines-covered')} | {root.get('lines-valid')} | {pct('line-rate'):.1f}% |")
          print(f"| Branches | {root.get('branches-covered')} | {root.get('branches-valid')} | {pct('branch-rate'):.1f}% |")

          packages = root.findall('.//package')
          if packages:
              print('\n<details><summary>Per assembly</summary>\n')
              print('| Assembly | Lines | Branches |')
              print('| --- | ---: | ---: |')
              for p in sorted(packages, key=lambda p: p.get('name') or ''):
                  lr = float(p.get('line-rate') or 0) * 100
                  br = float(p.get('branch-rate') or 0) * 100
                  print(f"| {p.get('name')} | {lr:.1f}% | {br:.1f}% |")
              print('\n</details>')

          if len(files) > 1:
              print(f"\n_{len(files)} reports produced (one per target framework); totals shown for `{files[0]}`._")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: warn
          path: '**/coverage.cobertura.xml'

      - name: Install ClangSharpPInvokeGenerator + native runtime packages
        run: |
          dotnet tool install --global ClangSharpPInvokeGenerator --version 21.1.8.3
          # The dotnet tool packaging does not bundle libclang/libClangSharp;
          # pull matching native packages and let generate.sh point LD at them.
          mkdir -p /tmp/clangsharp-bootstrap
          cd /tmp/clangsharp-bootstrap
          dotnet new console -o dummy -n dummy --force
          cd dummy
          dotnet add package libclang.runtime.linux-x64        --version 21.1.8
          dotnet add package libClangSharp.runtime.linux-x64   --version 21.1.8

      - name: Verify generated bindings are up to date
        run: |
          bash generate/generate.sh
          if ! git diff --quiet -- src/PipeWire.NET/generated/; then
            echo "::error::Generated bindings are out of date."
            echo "Run 'bash generate/generate.sh' locally and commit the result."
            git diff -- src/PipeWire.NET/generated/
            exit 1
          fi

      - name: Run Linux integration tests (against installed runtime, no daemon required)
        run: dotnet test PipeWire.NET.slnx --no-build -c Release
             --filter "TestCategory=Integration&TestCategory!=RequiresDaemon" --max-parallel-test-modules 1

      - name: Install a headless PipeWire session
        run: |
          sudo apt-get install -y --no-install-recommends \
            pipewire wireplumber pipewire-bin \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire

      - name: Graph tests against a real daemon
        # Gating. Registry enumeration, object creation and linking need only the daemon and the
        # SPA support plugins, both of which a headless runner hosts reliably.
        run: |
          # A private session, not just a private socket. WirePlumber persists default nodes,
          # saved routes and profiles under XDG_STATE_HOME, so sharing it lets one run's writes
          # decide the next run's starting state.
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_STATE_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          pipewire &           PW_PID=$!
          wireplumber &        WP_PID=$!
          for i in $(seq 1 40); do pw-cli info 0 >/dev/null 2>&1 && break; sleep 0.25; done
          set +e
          dotnet test PipeWire.NET.slnx --no-build -c Release \
            --filter "TestCategory=RequiresDaemon&TestCategory!=RequiresGpu&TestCategory!=RequiresGStreamer" --max-parallel-test-modules 1
          RC=$?
          set -e
          kill $WP_PID $PW_PID 2>/dev/null || true
          exit $RC

      - name: Session diagnostics
        if: failure()
        # "test timed out" is not diagnosable from a log. This is the state the daemon was in.
        run: |
          echo "::group::pw-dump"; pw-dump 2>&1 | head -400 || true; echo "::endgroup::"
          echo "::group::wpctl status"; wpctl status 2>&1 || true; echo "::endgroup::"
          echo "::group::links"; pw-link -l -I 2>&1 || true; echo "::endgroup::"
          echo "::group::clients"; pw-cli ls Client 2>&1 || true; echo "::endgroup::"
          echo "::group::metadata"; pw-metadata -n default 2>&1 || true; echo "::endgroup::"

      - name: Native AOT publish and run
        # IsAotCompatible is an analyzer switch. This is the only thing that proves the graph
        # actually links and that the published binary can talk to a daemon.
        run: |
          dotnet publish samples/PipeWire.NET.SampleConsole/PipeWire.NET.SampleConsole.csproj             -f net11.0 -r linux-x64 -c Release -p:PublishAot=true -o "$RUNNER_TEMP/aot"

          BIN="$RUNNER_TEMP/aot/PipeWire.NET.SampleConsole"
          test -x "$BIN"
          ldd "$BIN" | grep -q libcoreclr && { echo "not a native AOT binary"; exit 1; }

          # A private session, not just a private socket. WirePlumber persists default nodes,
          # saved routes and profiles under XDG_STATE_HOME, so sharing it lets one run's writes
          # decide the next run's starting state.
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_STATE_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          pipewire &           PW_PID=$!
          wireplumber &        WP_PID=$!
          for i in $(seq 1 40); do pw-cli info 0 >/dev/null 2>&1 && break; sleep 0.25; done

          # Exit 1 is the sample's "no video source", which a headless runner has. Connecting and
          # enumerating is what is being checked.
          set +e
          OUT=$("$BIN" 2>&1); RC=$?
          set -e
          echo "$OUT"
          kill $WP_PID $PW_PID 2>/dev/null || true

          echo "$OUT" | grep -q "connected to daemon" || { echo "AOT binary did not reach the daemon"; exit 1; }
          test $RC -le 1

      - name: Daemon end-to-end tests (GStreamer real sources)
        # Non-gating: these exercise a real GStreamer -> PipeWire graph and pass in a proper
        # PipeWire session (e.g. a desktop or WSL), but GitHub's headless runners cannot
        # reliably host pipewiresink producers, so frames never arrive and the tests time out.
        # Kept for signal; run locally for authoritative end-to-end validation.
        run: |
          # A private session, not just a private socket. WirePlumber persists default nodes,
          # saved routes and profiles under XDG_STATE_HOME, so sharing it lets one run's writes
          # decide the next run's starting state.
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_STATE_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          pipewire &           PW_PID=$!
          wireplumber &        WP_PID=$!
          for i in $(seq 1 40); do pw-cli info 0 >/dev/null 2>&1 && break; sleep 0.25; done
          set +e
          dotnet test PipeWire.NET.slnx --no-build -c Release \
            --filter "TestCategory=RequiresGStreamer&TestCategory!=RequiresGpu" --max-parallel-test-modules 1
          RC=$?
          set -e
          kill $WP_PID $PW_PID 2>/dev/null || true
          exit $RC

      - name: Pack
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet pack src/PipeWire.NET/PipeWire.NET.csproj --no-build -c Release -o ${{ env.NuGetDirectory }}
          dotnet pack src/PipeWire.NET.Media/PipeWire.NET.Media.csproj --no-build -c Release -o ${{ env.NuGetDirectory }}

      - name: Attest build provenance
        # Records, in a signed statement GitHub hosts, which workflow and which commit produced these
        # exact package files. Anyone who downloads the package can verify it came from this repository
        # rather than from someone who republished it under the same name.
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.NuGetDirectory }}/*.nupkg
      - name: Upload package artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.NuGetDirectory }}/*.nupkg

  daemon_version_skew:
    name: Daemon skew (PipeWire ${{ matrix.os }})
    # Explicitly non-gating, and separate from the required job for that reason: the bindings are
    # generated against whatever headers were installed, so an older daemon is expected to lack
    # interfaces this library binds. What this job is for is knowing which ones, deliberately,
    # instead of finding out from a user on an older distribution.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install a headless PipeWire session
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipewire wireplumber pipewire-bin

      - name: Report the versions under test
        run: |
          pipewire --version || true
          wireplumber --version || true

      - name: Graph tests against this daemon
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_STATE_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          pipewire &           PW_PID=$!
          wireplumber &        WP_PID=$!
          for i in $(seq 1 40); do pw-cli info 0 >/dev/null 2>&1 && break; sleep 0.25; done
          set +e
          dotnet test PipeWire.NET.slnx -c Release             --filter "TestCategory=RequiresDaemon&TestCategory!=RequiresGpu&TestCategory!=RequiresGStreamer"             --max-parallel-test-modules 1
          RC=$?
          set -e
          kill $WP_PID $PW_PID 2>/dev/null || true
          exit $RC

      - name: Session diagnostics
        if: failure()
        run: |
          echo "::group::pw-dump"; pw-dump 2>&1 | head -400 || true; echo "::endgroup::"
          echo "::group::wpctl status"; wpctl status 2>&1 || true; echo "::endgroup::"

  publish_nuget:
    name: Publish NuGet Packages
    needs: [build_and_test]
    # Publishing runs only when a GitHub release is published (or manually dispatched), matching
    # the other Agash packages. Requires a NuGet.org trusted-publishing policy for this package.
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Declaring an environment is what makes GitHub record a deployment, which is what
    # surfaces the Deployments tab and the package link on the repo home page.
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/PipeWire.NET
    permissions:
      contents: read
      id-token: write   # OIDC for NuGet.org trusted publishing

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.NuGetDirectory }}

      - uses: actions/setup-dotnet@v5

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Agash

      - name: Publish packages
        run: |
          for f in "${{ env.NuGetDirectory }}"/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
